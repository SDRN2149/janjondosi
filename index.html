<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잔존도시 v0.4</title>
<style>
:root{
 --bg:#10120f;--panel:#171a15;--panel2:#1d211a;--text:#d7dccf;--muted:#8f9986;
 --line:#394033;--accent:#b7c78f;--danger:#c98775;--good:#8fbf86;--warn:#d5b86f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
body{min-height:100vh}button{font:inherit}
.app{max-width:1180px;margin:0 auto;padding:18px}
.top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border:1px solid var(--line);background:var(--panel);padding:14px}
.title{font-size:20px;font-weight:800;letter-spacing:.08em}.time{color:var(--accent);text-align:right;white-space:pre-line}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);background:#131610;padding:8px}.stat b{display:block;font-size:12px;margin-bottom:4px}
.bar{height:8px;background:#262c23;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .25s}.low .fill{background:var(--danger)}
.main{display:grid;grid-template-columns:1.55fr .85fr;gap:12px;margin-top:12px}
.panel{border:1px solid var(--line);background:var(--panel);padding:14px}
.sceneTitle{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:10px;display:flex;justify-content:space-between;gap:12px}
.badge{font-size:11px;color:var(--muted);font-weight:400}
#ascii{min-height:215px;margin:0;padding:10px;background:#0c0e0b;border:1px solid #2c3129;white-space:pre;overflow:auto;line-height:1.08;font-size:14px}
#story{margin:12px 0 10px;line-height:1.7;min-height:82px;white-space:pre-line}
.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;color:var(--text);background:var(--panel2);border:1px solid var(--line);padding:11px 12px;cursor:pointer}
.choice:hover{border-color:var(--accent);color:#fff}.choice:disabled{opacity:.42;cursor:not-allowed}
.choice .meta{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.section{margin-bottom:16px}.section:last-child{margin-bottom:0}.section h3{font-size:13px;color:var(--accent);margin:0 0 8px}
.inv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.item{border:1px solid var(--line);background:#12150f;padding:8px;min-height:50px;color:inherit;text-align:left}
.item small{display:block;color:var(--muted);margin-top:3px}
.box{white-space:pre;font-size:12px;line-height:1.35;color:#bac5ae;background:#10120f;border:1px solid #2d332a;padding:9px;overflow:auto}
.log{height:165px;overflow:auto;background:#10120f;border:1px solid #2d332a;padding:8px;font-size:12px;line-height:1.5}.log div{margin-bottom:5px}
.good{color:var(--good)}.bad{color:var(--danger)}.warn{color:var(--warn)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini{background:#12150f;border:1px solid var(--line);color:var(--text);padding:8px;cursor:pointer;font-size:12px}.mini:hover{border-color:var(--accent)}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
.danger1{color:#9fc78e}.danger2{color:#c5c77f}.danger3{color:#d5b86f}.danger4{color:#cf9273}.danger5{color:#c96f6f}
@media(max-width:850px){.main{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}#ascii{font-size:12px}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
 <section class="top">
  <div>
   <div class="title">잔존도시 <span style="color:var(--muted)">v0.4</span></div>
   <div class="stats">
    <div class="stat" id="hpStat"><b>❤️ 체력 <span id="hpNum"></span></b><div class="bar"><div class="fill" id="hpBar"></div></div></div>
    <div class="stat" id="foodStat"><b>🍞 허기 <span id="foodNum"></span></b><div class="bar"><div class="fill" id="foodBar"></div></div></div>
    <div class="stat" id="waterStat"><b>💧 수분 <span id="waterNum"></span></b><div class="bar"><div class="fill" id="waterBar"></div></div></div>
    <div class="stat" id="energyStat"><b>💤 피로 <span id="energyNum"></span></b><div class="bar"><div class="fill" id="energyBar"></div></div></div>
    <div class="stat"><b>🏙 복구율 <span id="recoveryNum"></span>%</b><div class="bar"><div class="fill" id="recoveryBar"></div></div></div>
   </div>
  </div>
  <div class="time" id="timeBox"></div>
 </section>

 <div class="main">
  <section class="panel">
   <div class="sceneTitle"><span id="sceneTitle"></span><span class="badge" id="sceneBadge"></span></div>
   <pre id="ascii"></pre>
   <div id="story"></div>
   <div class="choices" id="choices"></div>
  </section>

  <aside class="panel">
   <div class="section"><h3>🎒 배낭 <span id="capacity"></span></h3><div class="inv" id="inventory"></div></div>
   <div class="section"><h3>🛠 은신처</h3><div class="box" id="upgradeInfo"></div></div>
   <div class="section"><h3>👥 사람 세력</h3><div class="box" id="factionInfo"></div></div>
   <div class="section"><h3>🗺 도시 현황</h3><div class="box" id="map"></div></div>
   <div class="section">
    <h3>💾 브라우저 저장</h3>
    <div class="controls">
     <button class="mini" onclick="manualSave()">저장</button>
     <button class="mini" onclick="manualLoad()">불러오기</button>
     <button class="mini" onclick="resetSave()">초기화</button>
    </div>
   </div>
   <div class="section"><h3>📟 기록</h3><div class="log" id="log"></div></div>
  </aside>
 </div>
 <div class="footer">작업대 레벨에 따라 제작 해금 · 은신처 시설은 실제 생존 효과를 제공 · 도시 복구율 100%가 장기 목표</div>
</div>

<script>
const SAVE_KEY="janjondosi_v04_save", OLD_SAVE_KEY="janjondosi_v03_save";

const freshState=()=>({
 day:1,hour:8,hp:100,food:82,water:80,energy:90,location:"shelter",
 maxCarry:9,inv:{"통조림":1,"생수":2,"붕대":1,"배터리":1},
 weather:"맑음",weatherDay:1,
 upgrades:{bed:0,tank:0,bench:0,radio:0,barricade:0,storage:0,generator:0,lighting:0},
 gear:{lantern:false,backpack:false,purifier:false},
 factions:{settlers:0,scavengers:0,engineers:0},
 recovery:0,
 restored:{school:false,hospital:false,substation:false,waterworks:false,cityhall:false,station:false},
 flags:{},
 raidCooldown:0,
 logs:[],ended:false
});
let state=freshState();

const itemData={
 "통조림":{icon:"🥫",desc:"허기 +28",use:()=>state.food=Math.min(100,state.food+28)},
 "생수":{icon:"💧",desc:"수분 +35",use:()=>state.water=Math.min(100,state.water+35)},
 "붕대":{icon:"🩹",desc:"체력 +22",use:()=>state.hp=Math.min(100,state.hp+22)},
 "배터리":{icon:"🔋",desc:"전력/제작 재료"},
 "고철":{icon:"🔩",desc:"수리·거래 재료"},
 "천조각":{icon:"🧵",desc:"제작 재료"},
 "목재":{icon:"🪵",desc:"건축 재료"},
 "초콜릿":{icon:"🍫",desc:"허기 +15",use:()=>state.food=Math.min(100,state.food+15)},
 "의약품":{icon:"💊",desc:"체력 +35",use:()=>state.hp=Math.min(100,state.hp+35)},
 "지도 조각":{icon:"🗺️",desc:"도시 정보"},
 "공구":{icon:"🔧",desc:"복구/고급 제작"},
 "우비":{icon:"🧥",desc:"비 피해 감소"},
 "정수제":{icon:"🧪",desc:"수분 +25",use:()=>state.water=Math.min(100,state.water+25)},
 "전자부품":{icon:"📟",desc:"희귀 전자 부품"},
 "의료키트":{icon:"🧰",desc:"체력 +55",use:()=>state.hp=Math.min(100,state.hp+55)},
 "연료":{icon:"⛽",desc:"발전/복구용 희귀 자원"},
 "보존식":{icon:"🍱",desc:"허기 +45",use:()=>state.food=Math.min(100,state.food+45)},
 "간이 랜턴":{icon:"🏮",desc:"장비 · 밤 지역 위험도 -1"},
 "강화 배낭":{icon:"🎒",desc:"장비 · 휴대 슬롯 +3"},
 "휴대 정수기":{icon:"🚰",desc:"장비 · 수분 소모 감소"}
};

const locations={
 shelter:{name:"🏠 은신처",danger:0,faction:"없음",text:"무너진 주택가의 반지하. 판자로 막은 창문과 빗물통, 임시 침상이 놓여 있다."},
 mart:{name:"🏪 폐상가",danger:2,faction:"회수꾼 영향",text:"유리문이 깨진 상가. 생활물자와 식료품을 구할 가능성이 높다."},
 school:{name:"🏫 폐교",danger:1,faction:"정착민 영향",text:"교실과 창고가 남아 있는 폐교. 비교적 안전하고 목재·천을 찾기 쉽다."},
 station:{name:"🚉 지하철역",danger:4,faction:"무주지",text:"침수된 어두운 역. 위험하지만 전자부품과 설비가 남아 있다."},
 factory:{name:"🏭 폐공장",danger:4,faction:"회수꾼 영향",text:"녹슨 설비와 금속이 가득한 공장. 고철과 공구를 구하기 좋다."},
 hospital:{name:"🏥 폐병원",danger:3,faction:"정착민 영향",text:"일부 병동이 무너진 병원. 의약품이 남아 있을 가능성이 있다."},
 apartment:{name:"🏢 아파트 단지",danger:2,faction:"정착민 영향",text:"비어 있는 세대가 수십 개 남아 있다. 생활물자와 사람 흔적이 많다."},
 substation:{name:"⚡ 변전소",danger:5,faction:"기술복구단 영향",text:"도시 전력망의 핵심 시설. 고압 설비 때문에 매우 위험하다."},
 waterworks:{name:"🚰 정수장",danger:4,faction:"기술복구단 영향",text:"도시 식수 설비가 남아 있는 정수장. 일부 배관은 아직 사용할 수 있다."},
 cityhall:{name:"🏛 시청",danger:3,faction:"무주지",text:"행정 기록과 통신 설비가 남은 시청. 옥상 안테나가 멀리서도 보인다."},
 market:{name:"🤝 임시시장",danger:1,faction:"중립지대",text:"세 세력이 물자를 교환하는 임시시장. 무기보다 물과 부품이 더 가치 있다."}
};

const lootTables={
 mart:["통조림","생수","초콜릿","배터리","붕대","천조각"],
 school:["생수","붕대","지도 조각","천조각","목재","목재"],
 station:["배터리","고철","고철","전자부품","정수제"],
 factory:["고철","고철","공구","배터리","목재"],
 hospital:["붕대","의약품","생수","천조각","의료키트"],
 apartment:["통조림","생수","천조각","목재","초콜릿"],
 substation:["전자부품","배터리","고철","연료"],
 waterworks:["정수제","생수","고철","공구"],
 cityhall:["지도 조각","배터리","전자부품","천조각"]
};

const rareLoot={
 mart:["보존식"],school:["우비"],station:["전자부품","연료"],factory:["공구","연료"],
 hospital:["의료키트"],apartment:["보존식"],substation:["전자부품","연료"],waterworks:["의료키트"],cityhall:["전자부품"]
};

const factionNames={settlers:"정착민 연합",scavengers:"회수꾼",engineers:"기술복구단"};

const recipes=[
 {cat:"생활",level:1,name:"붕대",icon:"🩹",cost:{"천조각":2},qty:1,desc:"상처를 치료하는 기본 붕대"},
 {cat:"생활",level:1,name:"정수제",icon:"🧪",cost:{"고철":1,"배터리":1},qty:1,desc:"오염된 물을 처리할 수 있는 정수제"},
 {cat:"생활",level:1,name:"생수",icon:"💧",cost:{"정수제":1},qty:1,desc:"정수제를 사용해 마실 물 확보"},
 {cat:"의료",level:1,name:"의약품",icon:"💊",cost:{"붕대":1,"정수제":1},qty:1,desc:"간단한 응급 의약품"},
 {cat:"의료",level:2,name:"의료키트",icon:"🧰",cost:{"붕대":2,"의약품":1,"천조각":1},qty:1,desc:"체력을 크게 회복하는 응급키트"},
 {cat:"장비",level:1,name:"간이 랜턴",icon:"🏮",cost:{"배터리":1,"고철":1},special:"lantern",desc:"밤 탐색 위험도를 1단계 낮춘다"},
 {cat:"장비",level:2,name:"강화 배낭",icon:"🎒",cost:{"천조각":3,"고철":2,"목재":1},special:"backpack",desc:"휴대 가능 슬롯을 3칸 늘린다"},
 {cat:"장비",level:2,name:"휴대 정수기",icon:"🚰",cost:{"정수제":2,"전자부품":1,"고철":1},special:"purifier",desc:"시간당 수분 소모량을 약 20% 줄인다"}
];

const upgrades=[
 {key:"bed",name:"🛏 침상",max:3,costs:[{"목재":2,"천조각":1},{"목재":3,"천조각":2},{"목재":4,"천조각":3}],effect:"수면 피로 회복량과 체력 회복량 증가"},
 {key:"tank",name:"💧 빗물통",max:3,costs:[{"고철":2},{"고철":3,"공구":1},{"고철":4,"공구":1,"목재":2}],effect:"빗물 확보량 증가 · Lv.3에서 비 오는 날 보너스"},
 {key:"bench",name:"🔧 작업대",max:2,costs:[{"고철":2,"목재":1},{"고철":3,"공구":1,"목재":2}],effect:"Lv.1 기본 제작 · Lv.2 고급 장비/의료 제작"},
 {key:"radio",name:"📻 무전기",max:2,costs:[{"배터리":2,"고철":1},{"전자부품":1,"배터리":2}],effect:"교신 정보 확인 · Lv.2에서 더 좋은 정보"},
 {key:"barricade",name:"🧱 바리케이드",max:3,costs:[{"목재":2,"고철":1},{"목재":3,"고철":2},{"목재":4,"고철":3,"공구":1}],effect:"은신처 습격 확률과 피해 감소"},
 {key:"storage",name:"📦 보관 선반",max:2,costs:[{"목재":2,"고철":1},{"목재":3,"고철":2}],effect:"레벨당 휴대/보관 슬롯 +2 · 습격 물자 손실 감소"},
 {key:"generator",name:"⚙ 발전기",max:2,costs:[{"고철":3,"공구":1,"배터리":1},{"전자부품":2,"고철":3,"공구":1}],effect:"연료를 배터리로 변환 · Lv.2 효율 증가"},
 {key:"lighting",name:"💡 조명 설비",max:2,costs:[{"배터리":2,"고철":1},{"전자부품":1,"배터리":2,"고철":1}],effect:"야간 제작 시간 단축 · 습격 위험 감소"}
];

function period(){let h=state.hour;return h>=6&&h<18?"낮":h>=18&&h<22?"해질녘":"밤"}
function weatherIcon(){return {"맑음":"☀","흐림":"☁","비":"🌧","강풍":"🌬"}[state.weather]||"☁"}
function chooseWeather(){let r=Math.random();state.weather=r<.42?"맑음":r<.7?"흐림":r<.9?"비":"강풍";state.weatherDay=state.day;log(`${weatherIcon()} 오늘의 날씨: ${state.weather}`,"warn")}
function ensureWeather(){if(state.weatherDay!==state.day)chooseWeather()}

function effectiveDanger(loc){
 let d=locations[loc].danger||0;
 if(period()==="밤"&&loc!=="shelter")d++;
 if(period()==="밤"&&loc!=="shelter"&&state.gear?.lantern)d--;
 if(state.weather==="강풍"&&loc!=="shelter")d++;
 if(state.recovery>=50)d--;
 return Math.max(0,Math.min(5,d));
}
function dangerStars(loc){let d=effectiveDanger(loc);return "●".repeat(d)+"○".repeat(5-d)}
function dangerClass(loc){return "danger"+Math.max(1,effectiveDanger(loc))}
function countInv(){return Object.values(state.inv).reduce((a,b)=>a+b,0)}
function hasCost(cost){return Object.entries(cost).every(([k,v])=>(state.inv[k]||0)>=v)}
function payCost(cost){for(const[k,v]of Object.entries(cost)){state.inv[k]-=v;if(state.inv[k]<=0)delete state.inv[k]}}
function costText(cost){return Object.entries(cost).map(([k,v])=>`${itemData[k]?.icon||"📦"}${k} ${v}`).join(" + ")}
function addItem(name,qty=1){let added=0;for(let i=0;i<qty;i++){if(countInv()>=state.maxCarry){log("배낭이 가득 찼다.","warn");break}state.inv[name]=(state.inv[name]||0)+1;added++}if(added)log(`${itemData[name]?.icon||"📦"} ${name} ×${added} 획득`,"good");return added}
function removeItem(name,qty=1){if((state.inv[name]||0)<qty)return false;state.inv[name]-=qty;if(state.inv[name]<=0)delete state.inv[name];return true}
function useItem(name){let it=itemData[name];if(!it?.use){log(`${name}은 바로 사용할 수 없다.`,"warn");return}if(removeItem(name)){it.use();log(`${it.icon} ${name} 사용`,"good");afterAction()}}
function clamp(){for(const k of["hp","food","water","energy"])state[k]=Math.max(0,Math.min(100,state[k]))}

function changeFaction(key,amount){state.factions[key]=Math.max(-100,Math.min(100,(state.factions[key]||0)+amount));log(`👥 ${factionNames[key]} 관계 ${amount>=0?"+":""}${amount}`,(amount>=0?"good":"bad"))}
function addRecovery(amount,reason){let before=state.recovery;state.recovery=Math.min(100,state.recovery+amount);if(state.recovery>before)log(`🏙 도시 복구율 +${state.recovery-before}% · ${reason}`,"good");if(state.recovery>=100&&!state.ended)cityEnding()}

function tick(hours=1){
 let oldDay=state.day;
 state.hour+=hours;state.food-=2.4*hours;state.water-=(state.gear?.purifier?2.5:3.1)*hours;state.energy-=2*hours;
 if(state.weather==="강풍"&&state.location!=="shelter")state.energy-=.7*hours;
 while(state.hour>=24){state.hour-=24;state.day++;log(`DAY ${state.day} 시작`,"good");ensureWeather();if(state.raidCooldown>0)state.raidCooldown--}
 if(state.day!==oldDay) maybeRaid("daychange");
 if(state.food<=0)state.hp-=4*hours;if(state.water<=0)state.hp-=7*hours;if(state.energy<=0)state.hp-=3*hours;
 clamp();checkGame()
}
function afterAction(){clamp();saveGame();render();checkGame()}

function searchArea(){

 if(Math.random()<uniqueChance()&&triggerUniqueEvent())return;
 const table=lootTables[state.location]||["고철"],n=Math.random()<.35?2:1,got=[];
 for(let i=0;i<n;i++){let item=table[Math.floor(Math.random()*table.length)];if(addItem(item))got.push(item)}
 if(period()==="밤"&&rareLoot[state.location]&&Math.random()<.42){
  let rr=rareLoot[state.location],rare=rr[Math.floor(Math.random()*rr.length)];

 if(Math.random()<.18)factionEncounter();

 }

  return;

제작할 종류를 선택한다.`,[
  {label:"🧰 생활용품",fn:()=>craftCategory("생활")},
  {label:"💊 의료품",fn:()=>craftCategory("의료")},
  {label:"⚙ 장비",fn:()=>craftCategory("장비")},

 ]);

function craftCategory(cat){
 const available=recipes.filter(r=>r.cat===cat);
 const opts=available.map(r=>{
  const locked=state.upgrades.bench<r.level;
  const already=r.special&&state.gear?.[r.special];
  const can=!locked&&!already&&hasCost(r.cost);
  let suffix=locked?` [작업대 Lv.${r.level} 필요]`:already?" [보유 중]":!hasCost(r.cost)?" [재료 부족]":"";
  return {
   label:`${r.icon} ${r.name} · ${costText(r.cost)}${suffix}`,
   meta:r.desc,
   disabled:!can,
   fn:()=>craftRecipe(r)
  };
 });
 opts.push({label:"↩ 제작 메뉴",fn:craftMenu});
 showScene(`🔧 제작 / ${cat}`,`작업대 Lv.${state.upgrades.bench}
재료를 소모해 물품을 만든다.`,opts);
}
function craftRecipe(r){
 if(state.upgrades.bench<r.level||!hasCost(r.cost))return;
 if(r.special&&state.gear?.[r.special])return;
 payCost(r.cost);
 if(r.special){
  state.gear[r.special]=true;
  if(r.special==="backpack")state.maxCarry+=3;
  log(`${r.icon} ${r.name} 장비 제작 완료`,"good");
 }else{
  addItem(r.name,r.qty||1);
  log(`${r.icon} ${r.name} 제작 완료`,"good");
 }
 const lightBonus=state.upgrades.lighting||0;
 tick(Math.max(.15,.5-lightBonus*.15));
 afterAction();
}
function upgradeMenu(){
 const opts=upgrades.map(u=>{
  const lv=state.upgrades[u.key]||0,done=lv>=u.max,cost=done?null:u.costs[lv];
  return {
   label:`${u.name} Lv.${lv}/${u.max}${done?" [MAX]":" · "+costText(cost)}`,
   meta:u.effect,
   disabled:done||!hasCost(cost),
   fn:()=>doShelterUpgrade(u)
  };
 });
 opts.push({label:"↩ 돌아가기",fn:render});
 showScene("🛠 은신처 강화","수집한 자원으로 은신처에 실제 기능을 추가한다.\n강화할수록 장기 생존과 도시 복구가 쉬워진다.",opts);
}
function doShelterUpgrade(u){
 const lv=state.upgrades[u.key]||0;
 if(lv>=u.max)return;
 const cost=u.costs[lv];
 if(!hasCost(cost))return;
 payCost(cost);
 state.upgrades[u.key]=lv+1;
 if(u.key==="barricade")addRecovery(2,"은신처 방어 강화");
 if(u.key==="storage")state.maxCarry+=2;
 if(u.key==="generator"&&state.upgrades.generator===1)addRecovery(2,"은신처 발전기 설치");
 if(u.key==="lighting"&&state.upgrades.lighting===1)addRecovery(1,"은신처 조명 설치");
 tick(1);
 log(`${u.name} Lv.${state.upgrades[u.key]} 강화 완료`,"good");
 afterAction();
}

function maybeRaid(source){
 if(state.location!=="shelter"||state.raidCooldown>0||state.day<2)return;
 let base=.18;
 base-=state.upgrades.barricade*.045;
 base-=(state.upgrades.lighting||0)*.025;

 if(source==="sleep")base+=.06;
 if(Math.random()>base)return;
 state.raidCooldown=2;
 const defense=state.upgrades.barricade;
 showScene("🚨 은신처 습격","밤중에 바깥에서 판자를 뜯는 소리가 난다.\n누군가 은신처의 물자를 노리고 있다.",[

   if(Math.random()<.48+defense*.16){log("침입자들이 포기하고 물러났다.","good");changeFaction("scavengers",-2)}
   else raidLoss();
   tick(.5);afterAction()
  }},
  {label:"📦 물자 일부를 내어준다",fn:()=>{loseRandomItems(2);log("물자를 내어주자 그들이 물러났다.","warn");tick(.25);afterAction()}}
 ])
}
function raidLoss(){state.hp-=Math.max(4,16-state.upgrades.barricade*4);loseRandomItems(Math.max(1,3-state.upgrades.barricade-(state.upgrades.storage||0)));log("습격으로 피해를 입었다.","bad")}
function loseRandomItems(n){
 let keys=Object.keys(state.inv);
 for(let i=0;i<n&&keys.length;i++){let k=keys[Math.floor(Math.random()*keys.length)];removeItem(k,1);log(`${itemData[k]?.icon||"📦"} ${k} 1개를 잃었다.`,"bad");keys=Object.keys(state.inv)}
}

function shelterChoices(){
 return [
  {label:"🚶 이동",fn:moveMenu},
  {label:"🔧 제작",fn:craftMenu},
  {label:"🛠 은신처 업그레이드",fn:upgradeMenu},
  {label:"🛏 8시간 수면",fn:rest},
  {label:"💧 빗물 마시기",fn:drinkRain},
  ...((state.upgrades.generator||0)>=1?[{label:"⚙ 발전기 가동",fn:generatorMenu}]:[]),
  ...(state.upgrades.radio>=1?[{label:"📻 무전 확인",fn:radioCheck}]:[])
 ]
}
function radioCheck(){
 const alerts=[
  "📻 정착민 연합: 폐병원 남쪽 통로는 아직 통행 가능.",
  "📻 회수꾼: 폐공장 서쪽 창고에서 금속 부품이 발견됐다는 소문.",
  "📻 기술복구단: 변전소 제어실 복구에 전자부품이 필요하다는 방송.",
  "📻 잡음 사이로 별다른 위험 신호는 들리지 않는다."
 ];
 log(alerts[Math.floor(Math.random()*alerts.length)],"warn");
 if((state.upgrades.radio||0)>=2&&Math.random()<.35){
   const intel=["지도 조각","배터리","정수제"][Math.floor(Math.random()*3)];
   addItem(intel,1);
   log("📻 교신을 통해 물자 위치 정보를 얻었다.","good");
 }
 saveGame();render()
}

function showScene(title,text,opts){
 document.getElementById("sceneTitle").textContent=title;
 document.getElementById("sceneBadge").textContent=`${weatherIcon()} ${state.weather} · ${period()}`;
 document.getElementById("ascii").textContent=artFor(state.location);
 document.getElementById("story").textContent=text;
 const ch=document.getElementById("choices");ch.innerHTML="";
 opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.disabled=!!o.disabled;b.onclick=o.fn;b.innerHTML=`[${i+1}] ${o.label}${o.meta?`<span class="meta">${o.meta}</span>`:""}`;ch.appendChild(b)});
 updateUI()
}
function render(){
 if(state.ended)return;
 ensureWeather();
 const L=locations[state.location];
 document.getElementById("sceneTitle").textContent=L.name;
 document.getElementById("sceneBadge").textContent=`${weatherIcon()} ${state.weather} · ${period()}${state.location!=="shelter"?" · 위험 "+dangerStars(state.location):""}`;
 document.getElementById("ascii").textContent=artFor(state.location);
 let extra=period()==="밤"&&state.location!=="shelter"?"\n\n밤이라 위험은 커졌지만 희귀 물자를 발견할 가능성도 높다.":"";
 document.getElementById("story").textContent=L.text+extra;
 const opts=state.location==="shelter"?shelterChoices():state.location==="market"?[{label:"🤝 거래하기",fn:tradeMenu},{label:"🚶 다른 지역으로 이동",fn:moveMenu},{label:"🏠 은신처로 귀환",fn:returnHome}]:[
  {label:"🔎 주변 수색",fn:searchArea},
  ...(repairAction(state.location)?[repairAction(state.location)]:[]),
  {label:"🚶 다른 지역으로 이동",fn:moveMenu},
  {label:"🏠 은신처로 귀환",fn:returnHome}
 ];
 const ch=document.getElementById("choices");ch.innerHTML="";
 opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.disabled=!!o.disabled;b.innerHTML=`[${i+1}] ${o.label}${o.meta?`<span class="meta">${o.meta}</span>`:""}`;b.onclick=o.fn;ch.appendChild(b)});
 updateUI()
}

function updateUI(){
 document.getElementById("timeBox").textContent=`DAY ${String(state.day).padStart(2,"0")}\n${String(Math.floor(state.hour)).padStart(2,"0")}:${state.hour%1>=.5?"30":"00"}\n${weatherIcon()} ${state.weather}`;
 for(const [k,id]of[["hp","hp"],["food","food"],["water","water"],["energy","energy"]]){document.getElementById(id+"Num").textContent=Math.round(state[k]);document.getElementById(id+"Bar").style.width=state[k]+"%";document.getElementById(id+"Stat").classList.toggle("low",state[k]<30)}
 document.getElementById("recoveryNum").textContent=state.recovery;document.getElementById("recoveryBar").style.width=state.recovery+"%";
 const inv=document.getElementById("inventory");inv.innerHTML="";
 let names=Object.keys(state.inv);
 if(!names.length)inv.innerHTML='<div class="item" style="grid-column:1/-1;color:var(--muted)">비어 있음</div>';
 else names.forEach(name=>{let it=itemData[name]||{icon:"📦",desc:""};let d=document.createElement("button");d.className="item";d.style.cursor=it.use?"pointer":"default";d.innerHTML=`${it.icon} ${name} ×${state.inv[name]}<small>${it.desc}${it.use?" · 클릭해 사용":""}</small>`;if(it.use)d.onclick=()=>useItem(name);inv.appendChild(d)});
 document.getElementById("capacity").textContent=`${countInv()}/${state.maxCarry}`;
 document.getElementById("upgradeInfo").textContent=
`🛏 침상         Lv.${state.upgrades.bed}
💧 빗물통       Lv.${state.upgrades.tank}
🔧 작업대       Lv.${state.upgrades.bench}
📻 무전기       Lv.${state.upgrades.radio}
🧱 바리케이드   Lv.${state.upgrades.barricade}
📦 보관 선반     Lv.${state.upgrades.storage||0}
⚙ 발전기       Lv.${state.upgrades.generator||0}
💡 조명 설비     Lv.${state.upgrades.lighting||0}

[장비]
🏮 랜턴          ${state.gear?.lantern?"보유":"없음"}
🎒 강화 배낭     ${state.gear?.backpack?"보유":"없음"}
🚰 휴대 정수기   ${state.gear?.purifier?"보유":"없음"}`;
 document.getElementById("factionInfo").textContent=
`🏘 정착민 연합   ${fmtRep(state.factions.settlers)}
🔩 회수꾼       ${fmtRep(state.factions.scavengers)}
⚙ 기술복구단   ${fmtRep(state.factions.engineers)}`;
 const restored=Object.entries(state.restored).filter(x=>x[1]).length;
 document.getElementById("map").textContent=
`🏙 도시 복구율 ${state.recovery}%
복구 시설 ${restored}/6

     🏥 병원 ─ 🏛 시청
        │        │
🏢 아파트─🏠 은신처─🏪 상가
        │        │
     🏫 학교   🤝 시장
        │
🚰 정수장─🚉 지하철─🏭 공장
        │
      ⚡ 변전소`;
 const box=document.getElementById("log");box.innerHTML="";
 state.logs.slice().reverse().forEach(x=>{let d=document.createElement("div");d.className=x.cls||"";d.textContent=x.text;box.appendChild(d)})
}
function fmtRep(v){return `${v>=0?"+":""}${v} ${v>=40?"[우호]":v<=-25?"[적대]":"[중립]"}`}
function log(msg,cls=""){let text=`[D${state.day} ${String(Math.floor(state.hour)).padStart(2,"0")}:00] ${msg}`;state.logs.push({text,cls});if(state.logs.length>100)state.logs.shift()}
function checkGame(){if(state.hp<=0){state.ended=true;endScreen(false)}}
function cityEnding(){
 state.ended=true;
 document.getElementById("sceneTitle").textContent="🏙 도시 재가동";
 document.getElementById("sceneBadge").textContent="";
 document.getElementById("ascii").textContent=`
        .        *        .
   ──────── CITY GRID ────────
      💡  💡  💡  💡
   ██████████████████████
     WATER / POWER / RADIO
        ONLINE  100%
`;
 document.getElementById("story").textContent="도시의 불이 하나둘 다시 켜진다.\n완전히 이전과 같지는 않지만, 이제 이곳은 폐허만은 아니다.";
 const ch=document.getElementById("choices");ch.innerHTML="";
 const b=document.createElement("button");b.className="choice";b.textContent="[1] 새 게임 시작";b.onclick=()=>{state=freshState();chooseWeather();saveGame();render()};ch.appendChild(b);saveGame();updateUI()
}
function endScreen(win){
 document.getElementById("sceneTitle").textContent="GAME OVER";document.getElementById("sceneBadge").textContent="";
 document.getElementById("ascii").textContent=`        .
       /|\\
      / | \\
  ____  |  ____
 /    \\_|_/    \\`;
 document.getElementById("story").textContent="도시는 아무 말도 하지 않는다. 당신의 기록은 여기서 끝났다.";
 const ch=document.getElementById("choices");ch.innerHTML="";
 const b=document.createElement("button");b.className="choice";b.textContent="[1] 처음부터 다시 시작";b.onclick=()=>{state=freshState();chooseWeather();saveGame();render()};ch.appendChild(b);saveGame();updateUI()
}

function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function mergeLoaded(data){
 let f=freshState(),s=Object.assign(f,data||{});
 s.inv=Object.assign({},data?.inv||f.inv);
 s.upgrades=Object.assign(f.upgrades,data?.upgrades||{});
 s.gear=Object.assign(f.gear,data?.gear||{});
 s.factions=Object.assign(f.factions,data?.factions||{});
 s.restored=Object.assign(f.restored,data?.restored||{});
 s.flags=Object.assign({},data?.flags||{});
 s.logs=Array.isArray(data?.logs)?data.logs:[];
 s.recovery=Number(data?.recovery||0);s.raidCooldown=Number(data?.raidCooldown||0);s.ended=false;
 const expectedCarry=9+(s.upgrades.storage||0)*2+(s.gear.backpack?3:0);
 if(!data?.maxCarry || s.maxCarry<expectedCarry)s.maxCarry=expectedCarry;
 return s
}
function loadGame(){
 try{
  let raw=localStorage.getItem(SAVE_KEY);
  if(raw){state=mergeLoaded(JSON.parse(raw));return true}
  let old=localStorage.getItem(OLD_SAVE_KEY);
  if(old){state=mergeLoaded(JSON.parse(old));log("v0.2 저장 데이터를 v0.3 형식으로 가져왔다.","good");saveGame();return true}
  return false
 }catch(e){return false}
}
function manualSave(){saveGame();log("💾 브라우저에 저장했다.","good");render()}
function manualLoad(){if(loadGame()){log("📂 저장 데이터를 불러왔다.","good");render()}else{log("저장 데이터가 없다.","warn");render()}}
function resetSave(){if(confirm("저장 데이터를 초기화할까요?")){localStorage.removeItem(SAVE_KEY);state=freshState();chooseWeather();log("새 게임을 시작했다.","good");saveGame();render()}}

document.addEventListener("keydown",e=>{if(/^[1-9]$/.test(e.key)){let btn=[...document.querySelectorAll(".choice")][Number(e.key)-1];if(btn&&!btn.disabled)btn.click()}});
window.addEventListener("beforeunload",saveGame);

if(!loadGame()){chooseWeather();log("라디오가 침묵한 지 43일째다.");log("장기 목표: 도시 복구율 100%.","good");saveGame()}else log("💾 저장 데이터를 자동으로 불러왔다.","good");
render();
startAsciiAnimation();
</script>
